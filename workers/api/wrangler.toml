name = "formn400-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Custom domain — zone confirmed 2026-08-25
routes = [
  { pattern = "api.formn400.org", custom_domain = true }
]

# Non-secret config only. Secrets are NEVER set here (API Invariant I).
#   Local dev:   workers/api/.dev.vars (gitignored)
#   Production:  npx wrangler secret put USCIS_CLIENT_ID
#                npx wrangler secret put USCIS_CLIENT_SECRET
[vars]
# "0" = live USCIS path. Set to "1" to serve canned responses with no
# credentials (local demos and development).
MOCK_MODE = "0"
# Official USCIS Case Status API — PRODUCTION endpoints, from the USCIS
# production-access approval for the "FormN400 Production" app (2026-10-26).
# Local dev stays on the SANDBOX: workers/api/.dev.vars sets both keys to the
# api-int.uscis.gov URLs, and .dev.vars overrides same-named [vars] during
# `wrangler dev`. See README "Production vs local dev".
USCIS_BASE_URL = "https://api.uscis.gov/case-status"
USCIS_TOKEN_URL = "https://api.uscis.gov/oauth/accesstoken"

# Rate limiting (Cloudflare Rate Limiting binding).
#   https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
# `simple.period` must be 10 or 60. Counters are shared by any binding on this
# account with the same namespace_id, and are counted per Cloudflare location,
# not globally. 20 per 60s per IP is far under the USCIS production quota of
# 10 requests per second and 400,000 per day for any one client. It is not a
# global cap: the quota protection is per connection, not for the whole Worker.
[[ratelimits]]
name = "CASE_STATUS_LIMITER"
namespace_id = "400221"

  [ratelimits.simple]
  limit = 20
  period = 60

# CORS origins are intentionally NOT configured here. The allowlist is hardcoded
# in src/cors.ts (API Invariant V) so it cannot be widened by a config typo.

# account_id and zone_id are intentionally NOT committed here.
